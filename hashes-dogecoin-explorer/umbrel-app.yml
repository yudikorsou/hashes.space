releaseNotes: >-
  Livestreams for verified organisations: an entry in VERIFIED_ADDRESSES can carry "streams" (a title and a https link each), for example a vegan animal food maker showing its food being packed. The organisation then gets a LIVE badge and a Watch live button on /verified, and a Live section with a player on its address page. YouTube (video or channel), Vimeo, Twitch and direct .m3u8 / .mp4 / .webm links play inside the page; any other https link opens on its own site. A stream only loads when the visitor presses play, so nothing is contacted before that.
  The animated Doge spaceship (the Shiba Inu pilot from the Find Mempool page) now also flies in the background of the Verified donation addresses page, behind the cards. It stands still when your device asks for less motion.
  Every address is now clickable (in the transaction flows and the transaction page) and opens a wallet page of its own at /address/<address>: the balance in DOGE read from your own node (the unspent coins it holds for that address, with the transaction, block and amount of each) behind a loading bar, a Copy button, and the organisation details when the address is verified. The first lookup of an address scans your node's unspent coins and can take up to a minute; it needs a Dogecoin Core that has scantxoutset.
  Verified donation addresses: the explorer can mark the Dogecoin addresses of organisations that help animals and accept donations in DOGE. A verified address shows a green "Verified" label with the organisation, what it does and its website wherever it appears in a transaction, a transaction that pays one gets a "to <organisation>" chip on its block page, and every verified address is listed on a page of its own, /verified (a card per organisation with a search bar, a Copy button for the address and a link to its website; also linked from the header and the home page) (and as JSON on /api/v1/verified-addresses); searching an address opens its page. The list lives in VERIFIED_ADDRESSES at the top of explorer.py and ships empty: addresses are added after checking them on the organisation's own website.
  Block and transaction pages now show how the coins move: every transaction of a block (the block reward paid to the miner is not listed: only the transfers between wallets) is drawn from the address it comes from, through the amount sent, to the addresses that receive it (full addresses and amounts), and coins that go back to the sender's own address are marked as change. A transaction page shows the same flow with its fee. The sending address is read from the transaction itself, so it works on any Dogecoin Core node; the amounts that came in and the fee need Dogecoin Core with -txindex=1 (or the transaction still being in the mempool).
  Four new pages, one for each block of the Dogecoin chain on the Find Mempool page, all built from your own node: /fee-sorting (the waiting transactions ranked by fee per byte, with a finder), /coinbase-merkle (the coinbase and the merkle root, hashed pair by pair), /block-assembly (the 80-byte header put together beside an animated block) and /block-candidate (the nonce search, with the chance of a block). Each also as .json and live every 5 seconds. They use the getblocktemplate of Dogecoin Core when it answers and your mempool otherwise.
  New /api/v1/mempool/top: the transactions that head the block being mined (best fee rate first). The Find Mempool page hashes them into a merkle root in its Coinbase & Merkle Root animation.
  The block page has a structured layout: title row with the pool, time, confirmations and previous/next buttons, key figures as tiles and a Mining card. The transaction list is removed from the block page.
  Housekeeping: wording in the code only.
  New /api/v1/mining/solo/<period>: the hashrate of miners that use no pool, estimated from the blocks of solo services and the blocks with no known pool, times the network's hashrate (an upper bound). Blocks whose coinbase names none of the known pools count as solo.
  The Find Mempool page's hashrate section now shows the combined hashrate of the mining pools (14 days, 1 month, 6 months, 1 year) instead of the whole network's: new /api/v1/mining/pool-hashrate/<period>, the network's hashrate times the share of blocks that pools mined. Over a long period the shares come from an evenly spread sample of the blocks.
  Hashrate and mining pool statistics for 24 hours, 14 days, 1 month, 6 months and 1 year. Uses the Dogecoin Core app's real RPC password (fixes "HTTP 401"); unknown pools no longer show garbled names.
  First release.
