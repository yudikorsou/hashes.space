releaseNotes: >-
  Block and transaction pages now show how the coins move: every transaction of a block is drawn from the address it comes from, through the amount sent, to the addresses that receive it (full addresses and amounts), and coins that go back to the sender's own address are marked as change. A transaction page shows the same flow with its fee. The sending address is read from the transaction itself, so it works on any Dogecoin Core node; the amounts that came in and the fee need Dogecoin Core with -txindex=1 (or the transaction still being in the mempool).
  Four new pages, one for each block of the Dogecoin chain on the Find Mempool page, all built from your own node: /fee-sorting (the waiting transactions ranked by fee per byte, with a finder), /coinbase-merkle (the coinbase and the merkle root, hashed pair by pair), /block-assembly (the 80-byte header put together beside an animated block) and /block-candidate (the nonce search, with the chance of a block). Each also as .json and live every 5 seconds. They use the getblocktemplate of Dogecoin Core when it answers and your mempool otherwise.
  New /api/v1/mempool/top: the transactions that head the block being mined (best fee rate first). The Find Mempool page hashes them into a merkle root in its Coinbase & Merkle Root animation.
  The block page has a structured layout: title row with the pool, time, confirmations and previous/next buttons, key figures as tiles and a Mining card. The transaction list is removed from the block page.
  Housekeeping: wording in the code only.
  New /api/v1/mining/solo/<period>: the hashrate of miners that use no pool, estimated from the blocks of solo services and the blocks with no known pool, times the network's hashrate (an upper bound). Blocks whose coinbase names none of the known pools count as solo.
  The Find Mempool page's hashrate section now shows the combined hashrate of the mining pools (14 days, 1 month, 6 months, 1 year) instead of the whole network's: new /api/v1/mining/pool-hashrate/<period>, the network's hashrate times the share of blocks that pools mined. Over a long period the shares come from an evenly spread sample of the blocks.
  Hashrate and mining pool statistics for 24 hours, 14 days, 1 month, 6 months and 1 year. Uses the Dogecoin Core app's real RPC password (fixes "HTTP 401"); unknown pools no longer show garbled names.
  First release.
