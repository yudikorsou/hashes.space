releaseNotes: >-
  The fee-per-byte ranking page (/fee-ranking) now updates by itself every 5 seconds: new transactions, the key figures, the ranking and the search result change as they enter the pool, without reloading the page. New /fee-ranking.json serves the same data.
  New page /fee-ranking: the Fee-Per-Byte Ranking of the block that is being mined, with a simple explanation of what it is, the key figures, and the waiting transactions of your node ranked from the highest fee rate down, showing which ones fit in the next block. The Find Mempool page opens it from the first Monero block.
  New /api/v1/block-template: the next block as your Monero node sees it (major and minor version, previous block, timestamp and the merkle root, Monero tree hash, of a stand-in miner transaction and the best-paying transactions of the pool). The Find Mempool page builds its Monero Block assembly animation from it.
  Transaction pages (for example the miner reward transaction of a block) are in the same design: hash and block in a title row, key figures as tiles, and Details, Inputs and Outputs cards. The classic page with Decode outputs and Prove sending is one link away.
  The block page is rebuilt in the design of the other hashes.space explorers: a title row with the payout type, time, confirmations and previous/next buttons, key figures as tiles, and Mining and Header cards. The transaction list is left out; every other page is still the Onion Monero Blockchain Explorer.
  New /api/v1/mining/pool-hashrate/<period>: Monero blocks name no pool, so this is the hashrate of the P2Pool miners (the only pool whose blocks show on the chain): the network's hashrate times the share of P2Pool blocks.
  The explorer now also serves the hashrate and payout-split statistics (/api/v1/mining/...) that the
  hashes.space Find Mempool page shows for Monero, computed from your own Monero node.


  The explorer now runs on Alpine Linux like the Monero Node app, so both can share the blockchain
  database (it used to hang on start), and on any 64-bit Intel/AMD or ARM processor.
