# Builds the Onion Monero Blockchain Explorer (xmrblocks) for the hashes Monero Explorer Umbrel app
# (hashes-monero-explorer/) and pushes it to ghcr.io/<owner>/hashes-monero-explorer, for amd64 and arm64
# (Umbrel Home, Raspberry Pi). Run it from the Actions tab; compiling Monero takes about an hour per platform.
name: Monero explorer image

on:
  workflow_dispatch:
    inputs:
      monero_tag:
        description: Monero release the explorer is built against (match the Monero Node app)
        default: v0.18.5.1
      explorer_ref:
        description: onion-monero-blockchain-explorer commit or branch
        default: master

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hashes-monero-explorer

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - name: Check out the explorer
        uses: actions/checkout@v4
        with:
          repository: moneroexamples/onion-monero-blockchain-explorer
          ref: ${{ inputs.explorer_ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Ubuntu 24.04 LTS: ubuntu:latest moves on to newer compilers and Boost the explorer may not build with yet
      - name: Use Ubuntu 24.04 in the Dockerfile
        run: sed -i 's/ubuntu:latest/ubuntu:24.04/g' Dockerfile
      - name: Build and push by digest
        id: build
        run: |
          set -o pipefail
          docker buildx build --platform ${{ matrix.platform }} --progress=plain \
            --build-arg MONERO_BRANCH=${{ inputs.monero_tag }} \
            --output type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true \
            --metadata-file /tmp/meta.json . 2>&1 | tee /tmp/build.log
          echo "digest=$(jq -r '."containerimage.digest"' /tmp/meta.json)" >> "$GITHUB_OUTPUT"
      # the job log is not readable everywhere: put the compiler errors in the run's annotations
      - name: Show the build errors
        if: failure()
        run: |
          msg=$(grep -nE "error|Error|undefined reference|No such file|not found" /tmp/build.log | grep -v "^.*-Werror" | tail -40 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build errors (${{ matrix.platform }})::$msg"
      - name: Save the digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both platforms as ${{ inputs.monero_tag }} and latest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t "$IMAGE:${{ inputs.monero_tag }}" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ inputs.monero_tag }}"
