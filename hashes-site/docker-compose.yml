version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hashes-site_web_1
      APP_PORT: 3000
      # a public website: no Umbrel login in front of it
      PROXY_AUTH_ADD: "false"

  web:
    # the official Python image (the same one the explorers use): serves the static pages, nothing else
    image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
    user: "1000:1000"
    restart: on-failure
    init: true
    environment:
      HOME: /tmp
    volumes:
      - ${APP_DATA_DIR}/mempool.html:/site/index.html:ro
      - ${APP_DATA_DIR}/demo.html:/site/demo.html:ro
    working_dir: /site
    command: ["python3", "-m", "http.server", "3000", "--bind", "0.0.0.0", "--directory", "/site"]
