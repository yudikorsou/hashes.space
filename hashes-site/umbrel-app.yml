manifestVersion: 1
id: hashes-site
category: crypto
name: hashes.space
version: "1.9.69"
tagline: The hashes.space Find Mempool page, served from your own Umbrel
icon: https://raw.githubusercontent.com/yudikorsou/hashes.space/main/hashes-site/icon.png
description: >-
  Serves the hashes.space pages straight from your Umbrel: the Find Mempool page, where you watch
  blocks and the mempool of Bitcoin SHA-256, Bitcoin BLAKE2b, Monero and Dogecoin side by side, and
  the fleet dashboard demo.


  Published on the internet (for example with the Cloudflare Tunnel app), the page streams blocks
  live. Monero and Dogecoin come from your own full nodes through the Monero Explorer and Dogecoin
  Explorer apps, so no third party sees what your visitors look at. Bitcoin SHA-256 is read from your own node through the Bitcoin Explorer app (btc.hashes.space), pruned
  or not, with no third party behind it; Bitcoin BLAKE2b the same way, from your Bitcoin Knots node through the Bitcoin BLAKE2b Explorer
  app (btcb2.hashes.space).


  A browser can only reach these explorers from a real web page, which is why the page shows
  simulated blocks in a preview or sandbox and live blocks once you serve it from here.
developer: hashes.space
website: https://hashes.space
dependencies:
  - monero
  - bitcoin
repo: https://github.com/yudikorsou/hashes.space
support: https://github.com/yudikorsou/hashes.space/issues
port: 4083
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: yudikorsou
submission: https://github.com/yudikorsou/hashes.space
releaseNotes: >-
  The "More insights" page (Pick a mining pool) no longer has the two links at the bottom ("Back to the mempool" and "Calculate hashrate"); the "Back to the mempool" button next to the search bar stays.
  On the "More insights" page (Pick a mining pool) there is now a "Back to the mempool" button right next to the search bar, and the "Back to the mempool" link at the bottom of the page is gone.
  On a mining pool's page the "Back to the mempool" link at the bottom is now a button right next to the block search bar (it reads "Back to the mining pools" when you came from the pick-a-pool page).
  The "More insights" page (Pick a mining pool) no longer shows the blockchain picker and search bar above it either; the title, the sun and the black holes start right under the top bar. They come back on the other pages.
  A mining pool's page (opened with "View pool profile") no longer shows the blockchain picker and search bar above it; the pool's name and blocks start right under the top bar. They come back when you leave the pool page.
  A mining pool's page now shows a loading bar (orange to blue, like the rest of the page) with the number of blocks read so far while your explorer is still reading the pool's blocks. It disappears when all blocks are in.
  On a mining pool's page the "Miners named in its blocks" list is gone; a search bar sits in its place and finds a block of that pool by its height or its hash (the blocks narrow down as you type).
  A mining pool's page now shows every block the pool mined since the last difficulty adjustment (not a fixed 14 days), on Bitcoin and Bitcoin BLAKE2b. Each time a new difficulty adjustment starts (every 2016 blocks) the page starts over with the new blocks of that period. Update the Bitcoin Explorer (1.18.6) and the Bitcoin BLAKE2b Explorer (1.17.6) apps too.
  A mining pool's page now shows every block the pool mined in the last 14 days (all of them, not just the latest 40) as miniature mined blocks, on Bitcoin and Bitcoin BLAKE2b. It fills in while your explorer reads the blocks, so update the Bitcoin Explorer (1.18.5) and the Bitcoin BLAKE2b Explorer (1.17.5) apps too. Without the update you still see the pool's latest blocks.
  A mining pool's page (opened with "View pool profile") now shows every block of the pool as a miniature of the animated mined block: the same 3D block with its height plate, median fee and fee range, size, transactions, age, the pool name and the DATUM label. A block opens its page on your explorer, as in the strip.
  The "More insights" button in the mining pool hashrate section now opens a page of its own where you pick a mining pool as a black hole. Only the pools of the blockchain you are on stand there (Bitcoin pools from your Bitcoin node, BLAKE2b pools from your Bitcoin Knots node and explorer, Dogecoin from your Dogecoin node, Monero from your Monero node), each as a hole in a tidy row, sized by its hashrate and standing perfectly still while only the matter around it circles. Under each hole: the pool name, its blocks and its hashrate, and a "View pool profile" button that opens the pool's page. The title, the intro text and the search bar sit right above the black holes, and on Bitcoin the animated sun hangs in the background on the right side of the page, shining down on the pools. Click a hole to see every block that pool mined; switch blockchain at the top to see another chain's pools, search a pool by name, and use the arrows for more pools.
  The animated sun on the Bitcoin chain's mining pool hashrate section now looks like a real photograph of the sun: a deep orange surface covered in fine dark red and bright yellow mottling, white-hot active regions, a red glowing edge, slowly turning. It hangs far away in the background behind the black holes, lights the edge of each hole that faces it, and throws off sparks. Only on Bitcoin; it stands still when you prefer less motion.
  The four blocks of the Dogecoin chain (Fee Sorting, Coinbase & Merkle Root, Block assembly, Candidate block) are clickable and open their own page on the Dogecoin Explorer.
  The Monero chain no longer shows the "Mining pool calculator" button in the mining pools section.
  On the Dogecoin chain the mining pools section now has a little spaceship with a Shiba Inu pilot that flies between the black holes (only on Dogecoin; it is decoration, not data).
  On the Monero chain the four clickable blocks (Fee-Per-Byte Ranking, Dynamic Block Size, Block assembly, Candidate block) now show a small arrow on their label, and rise and light up when you hover over them.
  On the Monero chain the Candidate block is now clickable: it opens the block candidate page of your Monero Explorer.
  On the Monero chain the Block assembly block is now clickable: it opens the projected block page of your Monero Explorer.
  On the Monero chain the Dynamic Block Size block is now clickable: it opens the live Dynamic Block Size page of your Monero Explorer.
  On the Monero chain the Fee-Per-Byte Ranking block is now clickable: it opens the new fee-per-byte ranking page of your Monero Explorer, for the block that is being mined.
  On the Monero chain the Block assembly animation now builds the miner (coinbase) transaction first and then the block header: major and minor version, timestamp, previous block, nonce and the merkle root, taken from your own Monero node when the Monero Explorer app is up to date.
  On the Monero chain a new animation sits between the Fee-Per-Byte Ranking and the Block assembly, tagged Dynamic Block Size: the median of the recent block sizes (never below 300 kB), the effective limit of twice the median, and the penalty on the block reward for a block bigger than the median, which a transaction must out-pay with its fee.
  On the Monero chain the first animation above the blocks is now a Fee-Per-Byte Ranking instead of a Fee Auction: the unconfirmed transactions are ranked by their fee rate, in nXMR per byte of transaction weight, from the highest down.
  The Candidate block of Bitcoin and Bitcoin BLAKE2b now follows on from the Block assembly: it shows the finished header (version, previous block, merkle root, time, bits and nonce), slides in again when the assembly is ready and keeps trying nonces. The assembly now also shows the merkle root being built.
  On the Bitcoin and Bitcoin BLAKE2b chains the Block assembly animation now shows how the block template is made: the coinbase transaction and block reward first, then the best packages are selected one after the other, each is checked against the block limits (one is skipped because it does not fit), and the selection is finalized.
  On the Dogecoin chain the Candidate block follows on from the Block assembly: the finished 80-byte header (version, previous block, merkle root, time, bits) is shown ready, slides in again each time the assembly completes, and the nonce and its scrypt result keep changing while it is hashed.
  On the Dogecoin chain the Block assembly animation now builds the 80-byte block header: version, previous block, merkle root, time, bits and nonce fly in one after the other and fill the 80 bytes.
  On the Dogecoin chain the second animation above the blocks is now Coinbase & Merkle Root: the coinbase transaction is built, the best-paying transactions of the mempool come in, and they are hashed in pairs up to the merkle root.
  On the Dogecoin chain the first animation above the blocks is tagged Fee Sorting instead of Fee Auction.
  The page, the apps and the docs no longer name any third-party mempool site: Bitcoin and Bitcoin BLAKE2b blocks come only from your own explorers, and the block links open them.
  The Bitcoin BLAKE2b blocks come only from your own Bitcoin BLAKE2b Explorer, and the block links open it.
  The View more link is gone from the mining pools sections, and for Bitcoin BLAKE2b too the pools, hashrate and difficulty come only from your own nodes, and the sections stay hidden until your node answers.
  The mining pools black holes glow like the labels under the mined blocks: red for a centralised pool, orange for OCEAN on Bitcoin and CONVOY on Bitcoin BLAKE2b, and on Monero green for P2Pool and red for the rest.
  The top of every block now leans the same way as its shaded side, so the blocks look like solid boxes seen from the right.
  The shaded side of every block is filled with the same colour as the block, a shade darker, so the side fills up with the block.
  All blocks, the ones being built and the mined ones, now show their shaded side on the right.
  The blocks being built before the fan (Block assembly and Candidate block) now show their shaded side on the right.
  On the Monero chain the sections swap places: How blocks are paid out is on the left and the mining pools black holes on the right.
  The Hashing now on label above the candidate block is set at the normal size instead of small, and it is centred over the block without moving it.
  The label above the candidate block now reads Hashing now on followed by the height of the block being hashed.
  The BTCB2 pool is no longer shown among the mining pools black holes.
  The order before the fan is now Fee Auction, Create new block (the package sorting animation), Block assembly and Candidate block.
  A new first step before Fee Auction, tagged Create new block: an animation of ancestor/descendant package sorting. A parent that pays little is grouped with the child that pays well, each package gets the fee rate of the whole, and the best-paying packages go into the block first.
  On wide desktop screens Fee Auction, Block assembly and Candidate block are spread over the whole space before the fan, with Inside the miners centred above them, so no empty room is left on the left.
  On wide desktop screens the blocks are bigger and spaced further apart, so Fee Auction, Block assembly and Candidate block fill their side of the fan.
  On a wide desktop screen the block row grows with the window, so the blocks fill the page instead of sitting small in the middle.
  The site now fetches its newest page straight from the repository, past GitHub's five-minute cache, so a new version shows up right after the app starts.
  The black holes on the next pages of mining pools are drawn as big as on the first page, so every page is easy to read. The hashrate under each name is still the real figure.
  The mining pools black holes show six pools at a time, biggest first, with arrows for the next six. OCEAN and CONVOY each get their own black hole. The Solominers heading and the headline sizes now match Inside the miners.
  Bitcoin hashrate by country is gone: Bitcoin, BLAKE2b and Dogecoin now show the hashrate of solo miners (miners that use no pool) next to the mining pools, read from your own explorers. Update those apps too.
  The hashrate section now has black holes, one per mining pool, sized by hashrate: hover one for its name and the hashrate it contributes. Built from your own nodes' pool statistics on all four chains. The View hashrate mining pools page is gone and the calculator button is now More insights.
  The hashrate section now shows the combined hashrate of the mining pools (14 days, 1 month, 6 months, 1 year) with their share of the network, read from the Bitcoin, Bitcoin Knots, Dogecoin and Monero explorers on your Umbrel. Update those apps too.
  Fee Auction is now only data on the page, without a block around it, and Block assembly animates the block being built up: the coinbase first, then the transactions flying in by fee rate while the totals count up.
  Two headlines on the Find Mempool strip: Inside the miners (the blocks before the fan) and The Blockchain (the mined blocks). The block being hashed is labelled with its proof of work, and the three blocks before the fan show the real data of the block being hashed.
  The proof-of-work and coin picker is now its own RAM module, separate from the search bar next to it, which still finds a block height or mining pool on the chosen chain. The first block is tagged Fee Auction.
  The header block on the Find Mempool page now shows the merkle root, version, bits and time of the block being hashed, read from the explorer's block template, and a nonce that searches through its range.
  The line between the blocks still to be mined and the mined blocks is now a spinning 3D fan: the blocks pass through it to the mined side.
  While the explorer's node is still syncing, the chain shows simulated blocks and tries again every minute.
  The Bitcoin BLAKE2b chain now streams from the new Bitcoin BLAKE2b Explorer app (btcb2.hashes.space), which reads blocks, fees,
  mining pools and the mempool from your Bitcoin Knots app, pruned or not. While that explorer does
  not answer or its node is still syncing, simulated blocks show. The Bitcoin SHA-256 chain streams from the new Bitcoin Explorer app (btc.hashes.space), which reads blocks, fees,
  mining pools and the mempool from your Bitcoin Node app, pruned or not. While that explorer
  does not answer or its node is still syncing, simulated blocks show. The Academy has seven chapter videos, one at a time with arrows.
