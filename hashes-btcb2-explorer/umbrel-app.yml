releaseNotes: >-
  The pool blocks endpoint /api/v1/mining/pool/<slug>/blocks/epoch now returns every block a pool mined since the last difficulty adjustment (the first block of the current 2016-block period) and starts over at each new adjustment. /blocks/14d is kept as an alias.
  A mining pool's block list now covers its last 14 days: /api/v1/mining/pool/<slug>/blocks/14d returns every block the pool mined in the last difficulty period, with its weight, median fee and fee range, so the Find Mempool pool profile page can show them all as miniature blocks.
  The block animation is no longer shown on the Bitcoin BLAKE2b explorer or on blocks mined by OCEAN on the Bitcoin explorer.
  Get verified now applies to every pool on the Bitcoin BLAKE2b explorer, and on the Bitcoin explorer only to blocks mined by OCEAN; other Bitcoin blocks show their payout addresses and the whole block to everyone.
  The Get verified box has new wording (only DATUM Verified pool contributors see the transaction information of the pool they hash on) and a boxed layout that no longer breaks words.
  The block page shows the difficulty of Bitcoin BLAKE2b blocks (the hashes a block takes, worked out from its bits) instead of 0.
  The block animation shows the first three transactions to visitors who are not verified, then the Get verified button; verified members see the whole block. The transaction list is removed from the block page.
  The block diagrams and block statistics match the rest of the block page: every chart is its own card with a divider under its title, the statistics are tiles with a short explanation under each value and a bar for the SegWit and Taproot shares, and the section titles are small capitals.
  Payout addresses are now hidden behind a Get verified button on the block, transaction and address pages and in the block animation, until the visitor signs in with Discord and holds the DATUM Verified role (set it up with a discord.json file in the app's data folder, see the README).
  The block page has a structured layout: title row with the pool, time, confirmations and previous/next buttons, key figures as tiles (transactions, fees, reward, fullness, size), then the details grouped in Mining and Header cards.
  Housekeeping: the explorer no longer mentions any outside site; while it syncs the page shows simulated blocks.
  New /api/v1/mining/solo/<period>: the hashrate of miners that use no pool, estimated from the blocks of solo services and the blocks with no known pool, times the network's hashrate (an upper bound).
  The Find Mempool page's hashrate section now shows the combined hashrate of the mining pools (14 days, 1 month, 6 months, 1 year) instead of the whole network's: new /api/v1/mining/pool-hashrate/<period>, the network's hashrate times the share of blocks that pools mined. The share of blocks per day is kept on disk, so on a pruned node the 6-month and 1-year charts keep growing beyond the 30 days it can read.
  The block template now asks Knots for the blake2b rule, which the BLAKE2b chain requires.
  New /api/v1/block-template: the header of the block being mined now, from your node's getblocktemplate, with the merkle root of that template (the nonce is only known once a block is found).
  Block animation headline: Every transaction hash going into block <number>.
