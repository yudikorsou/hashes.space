manifestVersion: 1
id: hashes-btcb2-explorer
category: crypto
name: Bitcoin BLAKE2b Explorer
version: "1.15.1"
tagline: A block explorer for the Bitcoin BLAKE2b chain, on your own Bitcoin Knots node
icon: https://raw.githubusercontent.com/yudikorsou/hashes.space/main/frontend/public/coins/bitcoin-blake2b.png
description: >-
  A light block explorer for the Bitcoin BLAKE2b chain (BTCB2) that reads blocks, fees, mining pools and the
  mempool straight from the Bitcoin Knots app on your Umbrel: no third party sees what you look up. A pruned
  node is enough for the newest blocks, which is what a live view needs. Search by block height, block hash
  or transaction id.


  It also offers mempool's API and WebSocket (/api/v1/blocks, /api/v1/fees/mempool-blocks,
  /api/v1/ws) and the global hashrate and mining pool statistics, worked out from your node, so the
  hashes.space Find Mempool page can stream Bitcoin BLAKE2b from your own node.
  Publish it on the internet (for example with the Cloudflare Tunnel app, as btcb2.hashes.space) to make it the
  BLAKE2b explorer of your website.


  Requires the Bitcoin Knots app, synced. It reads the Bitcoin app Umbrel gives it, so if Bitcoin Node and Bitcoin Knots are
  both installed, pick Bitcoin Knots for this app. While it is still syncing, the explorer says so and the page
  shows simulated blocks. /api/v1/status shows what the explorer sees of your node.
developer: hashes.space
website: https://hashes.space
dependencies:
  - bitcoin
repo: https://github.com/yudikorsou/hashes.space
support: https://github.com/yudikorsou/hashes.space/issues
port: 4085
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: yudikorsou
submission: https://github.com/yudikorsou/hashes.space
releaseNotes: >-
  Housekeeping: the explorer no longer mentions any outside site; while it syncs the page shows simulated blocks.
  New /api/v1/mining/solo/<period>: the hashrate of miners that use no pool, estimated from the blocks of solo services and the blocks with no known pool, times the network's hashrate (an upper bound).
  The Find Mempool page's hashrate section now shows the combined hashrate of the mining pools (14 days, 1 month, 6 months, 1 year) instead of the whole network's: new /api/v1/mining/pool-hashrate/<period>, the network's hashrate times the share of blocks that pools mined. The share of blocks per day is kept on disk, so on a pruned node the 6-month and 1-year charts keep growing beyond the 30 days it can read.
  The block template now asks Knots for the blake2b rule, which the BLAKE2b chain requires.
  New /api/v1/block-template: the header of the block being mined now, from your node's getblocktemplate, with the merkle root of that template (the nonce is only known once a block is found).
  Block animation headline: Every transaction hash going into block <number>.
